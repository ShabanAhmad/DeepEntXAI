project_name: DEEPENTXAI
seed: 42
target:
  description: Anti-Enterobacteriaceae compound bioactivity (Active/Inactive)
  organisms:
  - Escherichia coli
  - Klebsiella pneumoniae
  - Klebsiella oxytoca
  - Klebsiella aerogenes
  - Enterobacter cloacae
  - Salmonella enterica
  - Salmonella typhimurium
  - Shigella flexneri
  - Shigella sonnei
  - Serratia marcescens
  - Proteus mirabilis
  - Proteus vulgaris
  - Citrobacter freundii
  - Yersinia enterocolitica
  - Morganella morganii
  - Providencia stuartii
  - Enterobacter aerogenes
  - Shigella dysenteriae
  - Shigella boydii
  - Cronobacter sakazakii
  - Klebsiella variicola
  - Enterobacter hormaechei
  - Citrobacter koseri
  - Yersinia pestis
  - Yersinia pseudotuberculosis
  - Pantoea agglomerans
  - Hafnia alvei
  - Edwardsiella tarda
  - Salmonella bongori
download:
  sources:
  - ChEMBL
  - PubChem
  reuse_cache: true
  chembl_activity_types:
  - IC50
  - EC50
  - Ki
  - Kd
  - MIC
  chembl_max_pages_per_query: 50
  pubchem_max_assays_per_organism: 300
  pubchem_max_inactive_per_assay: 1500
  pubchem_max_total: 400000
  pubchem_max_organisms: 999
labeling:
  affinity_threshold_uM: 1.0
  affinity_inactive_uM: 50.0
  mic_active_ugml: 4.0
  mic_inactive_ugml: 64.0
  drop_ambiguous: true
  conflict_policy: majority
standardize:
  largest_fragment: true
  neutralize: true
  remove_stereo: false
  min_heavy_atoms: 3
  max_heavy_atoms: 100
features:
  morgan_bits: 2048
  morgan_radius: 2
  use_rdkit_descriptors: true
  use_maccs: true
  chemberta_model: seyonec/ChemBERTa-zinc-base-v1
  chemberta_max_len: 256
  variance_threshold: 0.0
  correlation_threshold: 0.95
  n_select: 100
  selection_method:
  - mutual_info
  - rfe
split:
  strategy: scaffold
  test_size: 0.15
  n_folds: 5
model:
  embed_dim: 128
  cnn_blocks: 2
  cnn_filters: 64
  cnn_kernel: 5
  lstm_units: 128
  dense_units: 128
  dropout: 0.3
  activation: relu
train:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  optimizer: adam
  early_stopping_patience: 12
  hpo_epochs: 20
  reduce_lr_patience: 5
  class_weight: true
  gradient_clipnorm: 1.0
  mixed_precision: auto
optuna:
  n_trials: 12
  timeout_min: 120
  direction: maximize
  metric: roc_auc
