# =============================================================================
# DEEPENTXAI | THRESHOLD VALUES  (single source of truth for data filtering)
# =============================================================================
# These thresholds define a HIGH-CONFIDENCE subset with a large "activity gap":
# only clearly-potent actives and clearly-inactive inactives are kept; the
# ambiguous middle is DROPPED. This yields cleaner classes (higher accuracy) and
# is scientifically defensible AS LONG AS it is reported honestly as a
# high-confidence subset and the train/test split stays scaffold-disjoint.
#
# It does NOT create data leakage: filtering happens on the LABEL/measurement,
# never using the split, and the scaffold-disjoint hold-out is preserved.
# =============================================================================

activity_gap:
  # affinity endpoints (IC50 / EC50 / Ki / Kd), micromolar
  affinity_active_uM:    1.0      # Active   if potency <= 1 uM   (potent binders)
  affinity_inactive_uM:  50.0     # Inactive if potency  > 50 uM  (clearly weak)
  #                                 1–50 uM  -> DROPPED (ambiguous)

  # MIC endpoint (phenotypic), ug/mL
  mic_active_ugml:       4.0      # Active   if MIC <= 4  ug/mL
  mic_inactive_ugml:     64.0     # Inactive if MIC >= 64 ug/mL
  #                                 4–64     -> DROPPED (ambiguous)

  # per-compound agreement: keep only structures whose measurements are
  # consistent (majority vote; 50/50 ties dropped). "unanimous" = strictest.
  conflict_policy: majority

# molecular sanity filters (applied during standardisation)
molecule_filters:
  min_heavy_atoms: 5
  max_heavy_atoms: 60
